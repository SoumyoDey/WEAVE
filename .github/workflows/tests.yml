name: tests

on:
  # Feature branches are covered by pull_request. Listing them here too would
  # run every suite twice for the same commit.
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Pinned rather than `ubuntu-latest`, so a runner migration is a deliberate
# commit whose diff points at the cause, instead of happening on a date nobody
# chose to a push that changed nothing. **Bumped 24.04 -> 26.04 on 2026-10-02**,
# ahead of `ubuntu-latest` moving to Ubuntu 26 from 2026-10-19 — which is the
# pin working as intended: the migration lands in its own commit, with its own
# CI result, rather than arriving inside someone else's.
#
# **The reason this pin used to give was wrong, and is corrected here.** It said
# the backend job apt-installs libgeos-dev / libproj-dev / proj-data / proj-bin
# and "Cartopy links against GEOS and PROJ", so an image change would move those
# versions underneath the render tests. Measured instead of assumed (2026-10-02):
# Cartopy's only compiled extension, `trace.cpython-313-x86_64-linux-gnu.so`,
# declares DT_NEEDED of libstdc++, libm, libgcc_s, libpthread and libc —
# **no GEOS and no PROJ**. It reaches geometry through `shapely`, whose wheel
# bundles libgeos and libgeos_c, and projections through `pyproj`, whose wheel
# bundles libproj. Both are manylinux wheels, and the manylinux policy forbids
# linking either library from the system in the first place.
#
# So the apt packages below are not what the render tests run against, and this
# pin is a general caution about runner images rather than the specific GEOS/PROJ
# hazard it claimed. Whether that apt step is needed at all is a separate
# question, deliberately not answered in the same commit as a runner bump — two
# changes where one invalidates the other's rationale make a red run ambiguous.
# See NEXT_STEPS.md §34.
#
# The cost is unchanged: a pin ages. 26.04 is supported into 2031, and this still
# wants revisiting rather than being left to rot.

# Superseding is right for a pull request and WRONG for `main`.
#
# On a PR branch only the tip matters, so cancelling the run in flight when a
# new commit arrives saves runner time and loses nothing.
#
# On `main` every commit needs its own verdict. With `cancel-in-progress: true`
# applied there, a second push a minute after the first killed the first
# commit's run and nothing ever re-ran it — so a commit sat on `main` with no
# CI result at all, while the branch still looked green because the *next*
# commit passed. Measured 2026-10-01: of the twelve most recent commits,
# `7769ae6` had only a cancelled run and `6e40a1a` had none.
#
# That is not a theoretical race. Two sessions committing to `main` in the same
# afternoon is how this repository is actually worked, and pushes land minutes
# apart. The invariant everything else here leans on — *`main` is green* — was
# quietly false for two commits.
#
# `false` makes same-ref runs queue instead of cancelling, so each commit gets a
# verdict in turn. The cost is runner minutes on a burst of pushes, which is the
# right thing to spend them on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Layer 1: components and pure helpers, in jsdom ──────────────────────────
  frontend-unit:
    name: frontend · jest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the development environment. Not load-bearing any more —
          # `yaml` is now an explicit devDependency (see README), so `npm ci`
          # also succeeds on the npm 10 that Node 20 ships.
          node-version: 24
          cache: npm

      - run: npm ci

      # GitHub sets CI=true, which already makes react-scripts single-run;
      # --watchAll=false states it rather than relying on that.
      - name: Run Jest
        run: npm test -- --watchAll=false

  # ── Layer 2: real Chromium, for what jsdom structurally cannot reach ────────
  frontend-e2e:
    name: frontend · playwright
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the development environment. Not load-bearing any more —
          # `yaml` is now an explicit devDependency (see README), so `npm ci`
          # also succeeds on the npm 10 that Node 20 ships.
          node-version: 24
          cache: npm

      - run: npm ci

      # Browser binaries are ~95 MB and land outside node_modules, so they need
      # their own cache. Keyed on the lockfile: a Playwright bump must redownload.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libs come from --with-deps above, which is skipped on a cache hit.
      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Needs no Flask API and no PostgreSQL: every assertion is client-side map
      # behaviour, and the app degrades to "no forecast overlay" without a
      # backend. playwright.config.js starts its own dev server.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ── The production bundle actually compiles ─────────────────────────────────
  frontend-build:
    name: frontend · build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the development environment. Not load-bearing any more —
          # `yaml` is now an explicit devDependency (see README), so `npm ci`
          # also succeeds on the npm 10 that Node 20 ships.
          node-version: 24
          cache: npm

      - run: npm ci

      # GitHub sets CI=true, so react-scripts treats webpack warnings as errors
      # here. The build is warning-clean today; keeping it strict is what stops
      # that from quietly decaying. Nothing else in the suite compiles the
      # production bundle — Jest and Playwright both run the dev pipeline.
      - name: Build
        run: npm run build

      # A build can exit 0 having emitted nothing useful; confirm the entry
      # point and a hashed bundle are actually on disk.
      - name: Check the bundle emitted
        run: |
          test -f build/index.html
          ls build/static/js/*.js > /dev/null
          echo "bundle size: $(du -sh build | cut -f1)"

  # ── Layer 3: the science, the endpoints, and the SQL against real Postgres ──
  backend:
    name: backend · pytest
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # fixture_db.py reads these to build its throwaway weave_fixture_test
      # database, so the role needs CREATEDB — the image's postgres superuser has it.
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

      # DB_NAME is deliberately NOT set. It names the *development* database
      # (`weave_weather`), which does not exist here and should not: the suite's
      # database-backed tests run against the fixture, which is built from
      # source DDL and has a known answer, rather than against whatever happens
      # to be loaded on a developer's machine. test_regrid_observations.py's
      # argument-guard tests depend on that — the live-table guard used to sit
      # below psycopg2.connect, and CI caught it precisely because DB_CONFIG
      # here points at nothing.
      #
      # The cost of leaving it unset used to be silent: test_run_registry.py's
      # fourteen database tests resolve through run_registry.DB_CONFIG, so they
      # skipped on every run this repository has ever had (`778 passed, 41
      # skipped`, identically, on ba3fa88, 7002a2d and 57a221c). They now use
      # the fixture database and run here. The two that remain local-only —
      # TestTheDevelopmentDatabaseIsCoherent — audit rows that exist only in
      # weave_weather; that module's docstring says so, and they name the reason
      # when they skip.
      #
      # WEAVE_REQUIRE_DB_TESTS turns "the fixture database could not be built"
      # from a skip into a failure, for every module that uses it. Without it a
      # broken service container shrinks the run instead of failing it, which is
      # the same green-tick-over-untested-SQL problem the reachability check
      # below exists to prevent, reached from inside pytest.
      WEAVE_REQUIRE_DB_TESTS: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            Data/requirements.txt
            Data/requirements-dev.txt

      # Cartopy links against GEOS and PROJ (see Data/requirements.txt).
      - name: Install GEOS and PROJ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgeos-dev libproj-dev proj-data proj-bin

      - name: Install Python dependencies
        run: pip install -r Data/requirements.txt -r Data/requirements-dev.txt

      # Both link against bundled or system C libraries, so `pip install`
      # succeeding does not mean `import` will. The same reasoning as the
      # PostgreSQL check below: these tests skip themselves when their
      # dependency is missing, so a broken install would shrink the run rather
      # than fail it. test_convert_aifs.py's 14 file-reading tests did exactly
      # that on every run until netCDF4 was declared (NEXT_STEPS.md §30).
      - name: Verify the compiled dependencies import
        run: |
          python -c "import netCDF4; print('netCDF4', netCDF4.__version__, '| HDF5', netCDF4.__hdf5libversion__, '| netcdf', netCDF4.__netcdf4libversion__)"
          python -c "import cartopy; print('cartopy', cartopy.__version__)"

      # The Cartopy renders pull Natural Earth 50m coastlines on first use.
      # Cache them so only the first run on a given key hits the network.
      - name: Cache Cartopy Natural Earth data
        uses: actions/cache@v6
        with:
          path: ~/.local/share/cartopy
          key: ${{ runner.os }}-cartopy-ne-50m

      # The database-backed tests skip themselves when PostgreSQL is
      # unreachable, so a broken service container would silently shrink the run
      # rather than fail it. Assert the database is actually there before
      # trusting a green tick. WEAVE_REQUIRE_DB_TESTS above is the other half:
      # this proves the server answers, that proves the tests reached it.
      - name: Verify PostgreSQL is reachable
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'SELECT version();'

      # Coverage is measured here rather than asserted in a document. The claim
      # that flask_api.py and metrics.py were both at 100% decayed to 97%
      # unnoticed, because nothing had ever run --cov: /api/runs landed with no
      # test at all and the number moved with no signal (NEXT_STEPS.md §33).
      # The section making the claim even said "worth re-checking rather than
      # trusting if the number ever matters" — and it was never re-checked.
      #
      # Scoped to the two modules that carry a documented figure. A whole-tree
      # percentage would be dominated by loader and migration scripts the suite
      # does not exercise, and a number nobody can act on is the kind that rots.
      #
      # 98.5 is a FLOOR, not a target. Measured 98.86% on 2026-10-01 — 2365
      # statements, 27 missing — so it catches roughly a ten-statement
      # regression, smaller than the untested endpoint that prompted it. Raising
      # it as coverage improves, or lowering it for a reason, is a deliberate
      # commit; that is the point of a number in CI rather than in prose.
      - name: Run pytest
        working-directory: Data
        run: >-
          python -m pytest -q
          --cov=flask_api --cov=metrics
          --cov-report=term-missing
          --cov-fail-under=98.5
