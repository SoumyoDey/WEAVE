name: tests

on:
  # Feature branches are covered by pull_request. Listing them here too would
  # run every suite twice for the same commit.
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Layer 1: components and pure helpers, in jsdom ──────────────────────────
  frontend-unit:
    name: frontend · jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the development environment. Not load-bearing any more —
          # `yaml` is now an explicit devDependency (see README), so `npm ci`
          # also succeeds on the npm 10 that Node 20 ships.
          node-version: 24
          cache: npm

      - run: npm ci

      # GitHub sets CI=true, which already makes react-scripts single-run;
      # --watchAll=false states it rather than relying on that.
      - name: Run Jest
        run: npm test -- --watchAll=false

  # ── Layer 2: real Chromium, for what jsdom structurally cannot reach ────────
  frontend-e2e:
    name: frontend · playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the development environment. Not load-bearing any more —
          # `yaml` is now an explicit devDependency (see README), so `npm ci`
          # also succeeds on the npm 10 that Node 20 ships.
          node-version: 24
          cache: npm

      - run: npm ci

      # Browser binaries are ~95 MB and land outside node_modules, so they need
      # their own cache. Keyed on the lockfile: a Playwright bump must redownload.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libs come from --with-deps above, which is skipped on a cache hit.
      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Needs no Flask API and no PostgreSQL: every assertion is client-side map
      # behaviour, and the app degrades to "no forecast overlay" without a
      # backend. playwright.config.js starts its own dev server.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ── The production bundle actually compiles ─────────────────────────────────
  frontend-build:
    name: frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the development environment. Not load-bearing any more —
          # `yaml` is now an explicit devDependency (see README), so `npm ci`
          # also succeeds on the npm 10 that Node 20 ships.
          node-version: 24
          cache: npm

      - run: npm ci

      # GitHub sets CI=true, so react-scripts treats webpack warnings as errors
      # here. The build is warning-clean today; keeping it strict is what stops
      # that from quietly decaying. Nothing else in the suite compiles the
      # production bundle — Jest and Playwright both run the dev pipeline.
      - name: Build
        run: npm run build

      # A build can exit 0 having emitted nothing useful; confirm the entry
      # point and a hashed bundle are actually on disk.
      - name: Check the bundle emitted
        run: |
          test -f build/index.html
          ls build/static/js/*.js > /dev/null
          echo "bundle size: $(du -sh build | cut -f1)"

  # ── Layer 3: the science, the endpoints, and the SQL against real Postgres ──
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # fixture_db.py reads these to build its throwaway weave_fixture_test
      # database, so the role needs CREATEDB — the image's postgres superuser has it.
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            Data/requirements.txt
            Data/requirements-dev.txt

      # Cartopy links against GEOS and PROJ (see Data/requirements.txt).
      - name: Install GEOS and PROJ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgeos-dev libproj-dev proj-data proj-bin

      - name: Install Python dependencies
        run: pip install -r Data/requirements.txt -r Data/requirements-dev.txt

      # The Cartopy renders pull Natural Earth 50m coastlines on first use.
      # Cache them so only the first run on a given key hits the network.
      - name: Cache Cartopy Natural Earth data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: ${{ runner.os }}-cartopy-ne-50m

      # test_db_endpoints.py skips itself when PostgreSQL is unreachable, so a
      # broken service container would silently shrink the run rather than fail
      # it. Assert the database is actually there before trusting a green tick.
      - name: Verify PostgreSQL is reachable
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'SELECT version();'

      - name: Run pytest
        working-directory: Data
        run: python -m pytest -q
